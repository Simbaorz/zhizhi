[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhizhi-web-api"
version = "0.1.0"
description = "Zhizhi streaming Agent Web API"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "gewu-agent-runtime[mysql,providers,redis]",
    "gewu-core[apollo,database,http,redis]",
    "greenlet>=3.3.2",
    "httpx==0.28.1",
    "zhizhi-application[llm-admin]",
    "python-multipart==0.0.30",
    "sqlalchemy>=2.0.49",
]

[project.scripts]
zhizhi-web-api = "zhizhi_web_api.__main__:main"

[tool.uv.sources]
zhizhi-application = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zhizhi_web_api"]
