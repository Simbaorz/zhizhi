[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhizhi-worker"
version = "0.1.0"
description = "Dedicated Zhizhi background worker process"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "celery[redis]==5.6.3",
    "gewu-agent-runtime[mysql]",
    "gewu-core[apollo,database,redis]",
    "zhizhi-application",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.49",
]

[project.scripts]
zhizhi-worker = "zhizhi_worker.__main__:main"

[tool.uv.sources]
zhizhi-application = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zhizhi_worker"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/src", "/tests"]
