[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhizhi-application"
version = "0.1.0"
description = "致知 subscriber rules for Gewu Agent Runtime"
requires-python = ">=3.12"
dependencies = [
    "gewu-agent-runtime",
    "gewu-core[database,redis]",
    "httpx==0.28.1",
    "minio==7.2.20",
    "opentelemetry-api==1.41.1",
    "pydantic==2.13.4",
    "pyjwt==2.12.1",
    "pymysql>=1.1,<2",
    "sqlalchemy==2.0.49",
]

[project.optional-dependencies]
llm-admin = [
    "anthropic==0.100.0",
    "openai==2.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zhizhi", "src/zhizhi_platform"]
